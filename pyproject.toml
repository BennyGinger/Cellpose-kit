[project]
name = "cellpose-kit"
version = "1.4.0"
description = "Wrapper function around cellpose. Will detect the version and load the appropriate backend implementation"
readme = "README.md"
authors = [
    { name = "Benoit Roux", email = "benoit.roux@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.4",
    "packaging>=25.0",
]

[project.optional-dependencies]
cellpose = [
    "cellpose>=3,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
